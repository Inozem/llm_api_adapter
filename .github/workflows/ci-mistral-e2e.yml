name: Mistral E2E

on:
  push:
    branches: ["dev"]
    paths:
      - ".github/workflows/ci-mistral-e2e.yml"
      - "packages/mistral/pyproject.toml"
      - "packages/mistral/src/**"
      - "packages/mistral/tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "src/llm_api_adapter/**"
      - "tests/e2e/conftest.py"
      - "tests/e2e/test_mistral.py"
      - "tests/requirements-test.txt"
      - "pytest.ini"
  pull_request:
    branches: ["dev"]
    paths:
      - ".github/workflows/ci-mistral-e2e.yml"
      - "packages/mistral/pyproject.toml"
      - "packages/mistral/src/**"
      - "packages/mistral/tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "src/llm_api_adapter/**"
      - "tests/e2e/conftest.py"
      - "tests/e2e/test_mistral.py"
      - "tests/requirements-test.txt"
      - "pytest.ini"

permissions:
  contents: read

jobs:
  e2e:
    name: Core + Mistral E2E
    runs-on: ubuntu-latest
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install core, Mistral plugin, and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install -e ".[async]"
          pip install -e "packages/mistral[async]"

      - name: Run Mistral E2E tests
        run: pytest -v -m e2e_mistral
