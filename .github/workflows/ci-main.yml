name: CI (main)

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
      - "mistral-v*"
      - "xai-v*"
    paths-ignore:
      - "packages/**"
      - ".github/workflows/ci-mistral-dev.yml"
      - ".github/workflows/ci-mistral-main.yml"
      - ".github/workflows/ci-xai-dev.yml"
      - ".github/workflows/ci-xai-main.yml"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "packages/**"
      - ".github/workflows/ci-mistral-dev.yml"
      - ".github/workflows/ci-mistral-main.yml"
      - ".github/workflows/ci-xai-dev.yml"
      - ".github/workflows/ci-xai-main.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test (main, Python ${{ matrix.python-version }})
    if: ${{ !startsWith(github.ref, 'refs/tags/mistral-v') && !startsWith(github.ref, 'refs/tags/xai-v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install -e ".[async]"

      - name: Unit & Integration Tests
        run: python tests/tests_runner.py

  test-gate:
    name: Test (main)
    runs-on: ubuntu-latest
    needs: [test, test-mistral, test-xai]
    if: ${{ always() }}

    steps:
      - name: Verify Python matrix
        run: |
          if [ "${{ needs.test.result }}" != "success" ] && [ "${{ needs.test.result }}" != "skipped" ]; then
            echo "One or more deterministic matrix jobs failed."
            exit 1
          fi

          if [ "${{ needs.test-mistral.result }}" != "success" ] && [ "${{ needs.test-mistral.result }}" != "skipped" ]; then
            echo "Mistral deterministic tests failed."
            exit 1
          fi

          if [ "${{ needs.test-xai.result }}" != "success" ] && [ "${{ needs.test-xai.result }}" != "skipped" ]; then
            echo "xAI deterministic tests failed."
            exit 1
          fi

  test-mistral:
    name: Test Mistral package (main, Python ${{ matrix.python-version }})
    if: ${{ startsWith(github.ref, 'refs/tags/mistral-v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core, Mistral plugin, and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install -e ".[async]"
          pip install -e "packages/organizations/mistral[async]"

      - name: Run Mistral unit tests
        run: pytest -v -m unit packages/organizations/mistral/tests

      - name: Run Mistral integration tests
        run: pytest -v -m integration packages/organizations/mistral/tests

  test-xai:
    name: Test xAI package (main, Python ${{ matrix.python-version }})
    if: ${{ startsWith(github.ref, 'refs/tags/xai-v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core, xAI plugin, and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install -e ".[async,httpx]"
          pip install -e "packages/organizations/xai"

      - name: Run xAI deterministic tests
        run: pytest -v -m unit packages/organizations/xai/tests

  publish-core-pypi:
    name: Publish core to PyPI
    runs-on: ubuntu-latest
    needs: test
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Build dist
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Publish core to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true

  publish-mistral-pypi:
    name: Publish Mistral package to PyPI
    runs-on: ubuntu-latest
    needs: test-mistral
    if: ${{ startsWith(github.ref, 'refs/tags/mistral-v') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Build Mistral distribution
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build packages/organizations/mistral

      - name: Publish Mistral package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/organizations/mistral/dist/
          verbose: true

  publish-xai-pypi:
    name: Publish xAI package to PyPI
    runs-on: ubuntu-latest
    needs: test-xai
    if: ${{ startsWith(github.ref, 'refs/tags/xai-v') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Build xAI distribution
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build packages/organizations/xai

      - name: Publish xAI package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/organizations/xai/dist/
          verbose: true
