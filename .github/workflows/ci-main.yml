name: CI (main)

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
      - "mistral-v*"
      - "xai-v*"
      - "kimi-v*"
      - "qwen-v*"
      - "deepseek-v*"
      - "zai-v*"
    paths-ignore:
      - "packages/**"
      - ".github/workflows/ci-mistral-dev.yml"
      - ".github/workflows/ci-mistral-main.yml"
      - ".github/workflows/ci-xai-dev.yml"
      - ".github/workflows/ci-xai-main.yml"
      - ".github/workflows/ci-kimi-dev.yml"
      - ".github/workflows/ci-kimi-main.yml"
      - ".github/workflows/ci-qwen-dev.yml"
      - ".github/workflows/ci-qwen-main.yml"
      - ".github/workflows/ci-deepseek-dev.yml"
      - ".github/workflows/ci-deepseek-main.yml"
      - ".github/workflows/ci-zai-dev.yml"
      - ".github/workflows/ci-zai-main.yml"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "packages/**"
      - ".github/workflows/ci-mistral-dev.yml"
      - ".github/workflows/ci-mistral-main.yml"
      - ".github/workflows/ci-xai-dev.yml"
      - ".github/workflows/ci-xai-main.yml"
      - ".github/workflows/ci-kimi-dev.yml"
      - ".github/workflows/ci-kimi-main.yml"
      - ".github/workflows/ci-qwen-dev.yml"
      - ".github/workflows/ci-qwen-main.yml"
      - ".github/workflows/ci-deepseek-dev.yml"
      - ".github/workflows/ci-deepseek-main.yml"
      - ".github/workflows/ci-zai-dev.yml"
      - ".github/workflows/ci-zai-main.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test (main, Python ${{ matrix.python-version }})
    if: ${{ !startsWith(github.ref, 'refs/tags/mistral-v') && !startsWith(github.ref, 'refs/tags/xai-v') && !startsWith(github.ref, 'refs/tags/kimi-v') && !startsWith(github.ref, 'refs/tags/qwen-v') && !startsWith(github.ref, 'refs/tags/deepseek-v') && !startsWith(github.ref, 'refs/tags/zai-v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install -e ".[async]"

      - name: Unit & Integration Tests
        run: python tests/tests_runner.py

  test-gate:
    name: Test (main)
    runs-on: ubuntu-latest
    needs: [test, test-mistral, test-xai, test-kimi, test-qwen, test-deepseek, test-zai]
    if: ${{ always() }}

    steps:
      - name: Verify Python matrix
        run: |
          if [ "${{ needs.test.result }}" != "success" ] && [ "${{ needs.test.result }}" != "skipped" ]; then
            echo "One or more deterministic matrix jobs failed."
            exit 1
          fi

          if [ "${{ needs.test-mistral.result }}" != "success" ] && [ "${{ needs.test-mistral.result }}" != "skipped" ]; then
            echo "Mistral deterministic tests failed."
            exit 1
          fi

          if [ "${{ needs.test-xai.result }}" != "success" ] && [ "${{ needs.test-xai.result }}" != "skipped" ]; then
            echo "xAI deterministic tests failed."
            exit 1
          fi

          if [ "${{ needs.test-kimi.result }}" != "success" ] && [ "${{ needs.test-kimi.result }}" != "skipped" ]; then
            echo "Kimi deterministic tests failed."
            exit 1
          fi

          if [ "${{ needs.test-qwen.result }}" != "success" ] && [ "${{ needs.test-qwen.result }}" != "skipped" ]; then
            echo "Qwen deterministic tests failed."
            exit 1
          fi

          if [ "${{ needs.test-deepseek.result }}" != "success" ] && [ "${{ needs.test-deepseek.result }}" != "skipped" ]; then
            echo "DeepSeek deterministic tests failed."
            exit 1
          fi

          if [ "${{ needs.test-zai.result }}" != "success" ] && [ "${{ needs.test-zai.result }}" != "skipped" ]; then
            echo "Z.ai deterministic tests failed."
            exit 1
          fi

  test-mistral:
    name: Test Mistral package (main, Python ${{ matrix.python-version }})
    if: ${{ startsWith(github.ref, 'refs/tags/mistral-v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core, Mistral plugin, and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install -e ".[async]"
          pip install -e "packages/organizations/mistral[async]"

      - name: Run Mistral unit tests
        run: pytest -v -m unit packages/organizations/mistral/tests

      - name: Run Mistral integration tests
        run: pytest -v -m integration packages/organizations/mistral/tests

  test-xai:
    name: Test xAI package (main, Python ${{ matrix.python-version }})
    if: ${{ startsWith(github.ref, 'refs/tags/xai-v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core, xAI plugin, and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install -e ".[async,httpx]"
          pip install -e "packages/organizations/xai"

      - name: Run xAI deterministic tests
        run: pytest -v -m unit packages/organizations/xai/tests

  test-kimi:
    name: Test Kimi package (main, Python ${{ matrix.python-version }})
    if: ${{ startsWith(github.ref, 'refs/tags/kimi-v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core, Kimi plugin, and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install -e ".[async,httpx]"
          pip install -e "packages/organizations/kimi[async,httpx]"

      - name: Run Kimi unit tests
        run: pytest -v --ignore=packages/organizations/kimi/tests/e2e -m unit packages/organizations/kimi/tests

      - name: Run Kimi integration tests
        run: pytest -v --ignore=packages/organizations/kimi/tests/e2e -m integration packages/organizations/kimi/tests

  test-qwen:
    name: Test Qwen package (main, Python ${{ matrix.python-version }})
    if: ${{ startsWith(github.ref, 'refs/tags/qwen-v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core, Qwen plugin, and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install -e ".[async,httpx]"
          pip install -e "packages/organizations/qwen[async,httpx]"

      - name: Run Qwen unit tests
        run: pytest -v --ignore=packages/organizations/qwen/tests/e2e -m unit packages/organizations/qwen/tests

      - name: Run Qwen integration tests
        run: pytest -v --ignore=packages/organizations/qwen/tests/e2e -m integration packages/organizations/qwen/tests

  test-deepseek:
    name: Test DeepSeek package (main, Python ${{ matrix.python-version }})
    if: ${{ startsWith(github.ref, 'refs/tags/deepseek-v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core, DeepSeek plugin, and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install -e ".[async,httpx]"
          pip install -e "packages/organizations/deepseek[async,httpx]"

      - name: Run DeepSeek unit tests
        run: pytest -v --ignore=packages/organizations/deepseek/tests/e2e -m unit packages/organizations/deepseek/tests

      - name: Run DeepSeek integration tests
        run: pytest -v --ignore=packages/organizations/deepseek/tests/e2e -m integration packages/organizations/deepseek/tests

  test-zai:
    name: Test Z.ai package (main, Python ${{ matrix.python-version }})
    if: ${{ startsWith(github.ref, 'refs/tags/zai-v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core, Z.ai plugin, and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install -e ".[async,httpx]"
          pip install -e "packages/organizations/zai[async,httpx]"

      - name: Run Z.ai unit tests
        run: pytest -v --ignore=packages/organizations/zai/tests/e2e -m unit packages/organizations/zai/tests

      - name: Run Z.ai integration tests
        run: pytest -v --ignore=packages/organizations/zai/tests/e2e -m integration packages/organizations/zai/tests

  publish-core-pypi:
    name: Publish core to PyPI
    runs-on: ubuntu-latest
    needs: test
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Build dist
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Publish core to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true

  publish-mistral-pypi:
    name: Publish Mistral package to PyPI
    runs-on: ubuntu-latest
    needs: test-mistral
    if: ${{ startsWith(github.ref, 'refs/tags/mistral-v') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Build Mistral distribution
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build packages/organizations/mistral

      - name: Publish Mistral package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/organizations/mistral/dist/
          verbose: true

  publish-xai-pypi:
    name: Publish xAI package to PyPI
    runs-on: ubuntu-latest
    needs: test-xai
    if: ${{ startsWith(github.ref, 'refs/tags/xai-v') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Build xAI distribution
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build packages/organizations/xai

      - name: Publish xAI package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/organizations/xai/dist/
          verbose: true

  publish-kimi-pypi:
    name: Publish Kimi package to PyPI
    runs-on: ubuntu-latest
    needs: test-kimi
    if: ${{ startsWith(github.ref, 'refs/tags/kimi-v') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Build Kimi distribution
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build packages/organizations/kimi

      - name: Publish Kimi package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/organizations/kimi/dist/
          verbose: true

  publish-qwen-pypi:
    name: Publish Qwen package to PyPI
    runs-on: ubuntu-latest
    needs: test-qwen
    if: ${{ startsWith(github.ref, 'refs/tags/qwen-v') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Build Qwen distribution
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build packages/organizations/qwen

      - name: Publish Qwen package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/organizations/qwen/dist/
          verbose: true

  publish-deepseek-pypi:
    name: Publish DeepSeek package to PyPI
    runs-on: ubuntu-latest
    needs: test-deepseek
    if: ${{ startsWith(github.ref, 'refs/tags/deepseek-v') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Build DeepSeek distribution
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build packages/organizations/deepseek

      - name: Publish DeepSeek package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/organizations/deepseek/dist/
          verbose: true

  publish-zai-pypi:
    name: Publish Z.ai package to PyPI
    runs-on: ubuntu-latest
    needs: test-zai
    if: ${{ startsWith(github.ref, 'refs/tags/zai-v') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Build Z.ai distribution
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build packages/organizations/zai

      - name: Publish Z.ai package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/organizations/zai/dist/
          verbose: true
