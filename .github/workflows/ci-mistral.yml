name: CI (Mistral)

on:
  push:
    branches: ["dev", "main"]
    paths:
      - ".github/workflows/ci-mistral.yml"
      - "packages/organizations/mistral/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "src/llm_api_adapter/adapters/base_adapter.py"
      - "src/llm_api_adapter/errors/**"
      - "src/llm_api_adapter/llm_registry/llm_registry.py"
      - "src/llm_api_adapter/llms/**"
      - "src/llm_api_adapter/models/**"
      - "src/llm_api_adapter/provider_registry.py"
      - "src/llm_api_adapter/universal_adapter.py"
      - "tests/requirements-test.txt"
      - "pytest.ini"
  pull_request:
    branches: ["dev", "main"]
    paths:
      - ".github/workflows/ci-mistral.yml"
      - "packages/organizations/mistral/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "src/llm_api_adapter/adapters/base_adapter.py"
      - "src/llm_api_adapter/errors/**"
      - "src/llm_api_adapter/llm_registry/llm_registry.py"
      - "src/llm_api_adapter/llms/**"
      - "src/llm_api_adapter/models/**"
      - "src/llm_api_adapter/provider_registry.py"
      - "src/llm_api_adapter/universal_adapter.py"
      - "tests/requirements-test.txt"
      - "pytest.ini"

permissions:
  contents: read

jobs:
  test:
    name: Test Mistral package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core, Mistral plugin, and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
          pip install -e ".[async]"
          pip install -e "packages/organizations/mistral[async]"

      - name: Run Mistral unit tests
        run: pytest -v -m unit packages/organizations/mistral/tests

      - name: Run Mistral integration tests
        run: pytest -v -m integration packages/organizations/mistral/tests
