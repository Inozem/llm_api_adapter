name: CI (dev release candidate)

env:
  PYTHON_VERSION: "3.10"

on:
  pull_request:
    branches: ["dev"]
    types: [closed]

permissions:
  contents: read

jobs:
  publish-testpypi:
    name: Publish to TestPyPI (merged dev candidate)
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.package_version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Read candidate version
        id: package_version
        shell: bash
        run: |
          candidate_version="$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f 2)"
          test -n "$candidate_version"
          echo "value=$candidate_version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Build dist
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  post-publish-e2e:
    name: E2E tests (post-publish)
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    needs: publish-testpypi
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      CANDIDATE_VERSION: ${{ needs.publish-testpypi.outputs.package_version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test runner and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Install candidate package from TestPyPI
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pip install --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple \
              "llm-api-adapter==${CANDIDATE_VERSION}"; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Candidate ${CANDIDATE_VERSION} is not available yet; retrying in 2 minutes."
              sleep 120
            fi
          done

          echo "Candidate ${CANDIDATE_VERSION} was not available after 3 attempts."
          exit 1

      - name: Run E2E tests
        run: pytest -v -m e2e_builtin
