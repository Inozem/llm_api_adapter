[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-api-adapter"
version = "0.9.1"
description = "Lightweight multi-provider LLM API adapter for Python — OpenAI, Anthropic, Google, Mistral, and xAI."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Sergey Inozemtsev"}]
keywords = ["llm", "adapter", "lightweight", "api", "xai", "grok"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = ["requests>=2.32"]

[project.optional-dependencies]
async = ["httpx>=0.28"]
httpx = ["httpx>=0.28"]
mistral = ["llm-api-adapter-mistral>=0.1.0,<0.2.0"]
xai = ["llm-api-adapter-xai>=0.1.0,<0.2.0"]

[project.urls]
Repository = "https://github.com/Inozem/llm_api_adapter/"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_api_adapter*"]
exclude = ["tests*", "*/tests*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"llm_api_adapter.llm_registry" = ["*.json", "organizations/*.json"]
